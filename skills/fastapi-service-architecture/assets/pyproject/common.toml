# The shared library every service depends on. No uvicorn, no service-specific
# clients - anything only one service needs belongs to that service, or this
# package becomes the place where all dependencies accumulate.
[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.141",
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
